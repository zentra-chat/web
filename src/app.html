<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Standard favicon -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />

		<!-- PNG favicons -->
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />

		<!-- Apple Touch Icons -->
		<link rel="apple-touch-icon" sizes="57x57" href="/favicon-57x57.png" />
		<link rel="apple-touch-icon" sizes="60x60" href="/favicon-60x60.png" />
		<link rel="apple-touch-icon" sizes="72x72" href="/favicon-72x72.png" />
		<link rel="apple-touch-icon" sizes="76x76" href="/favicon-76x76.png" />
		<link rel="apple-touch-icon" sizes="114x114" href="/favicon-114x114.png" />
		<link rel="apple-touch-icon" sizes="120x120" href="/favicon-120x120.png" />
		<link rel="apple-touch-icon" sizes="144x144" href="/favicon-144x144.png" />
		<link rel="apple-touch-icon" sizes="152x152" href="/favicon-152x152.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png" />

		<!-- Microsoft Tiles -->
		<meta name="msapplication-square70x70logo" content="/favicon-70x70.png" />
		<meta name="msapplication-square150x150logo" content="/favicon-150x150.png" />
		<meta name="msapplication-square310x310logo" content="/favicon-310x310.png" />

		<!-- Manifest-->
		<link rel="manifest" href="/site.webmanifest" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		%sveltekit.head%

		<!-- Fallback Open Graph / Social Meta (used when sveltekit.head has no page-specific tags) -->
		<title>Zentra</title>
		<meta name="description" content="Open-source, encrypted, community-hostable chat platform. Your conversations, your control." />
		<meta property="og:title" content="Zentra - Encrypted Community Chat" />
		<meta property="og:description" content="Open-source, encrypted, community-hostable chat platform. Your conversations, your control." />
		<meta property="og:url" content="https://zentra.abstractmelon.net" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Zentra" />
		<meta property="og:image" content="https://zentra.abstractmelon.net/og-image.svg" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Zentra - Encrypted Community Chat" />
		<meta name="twitter:description" content="Open-source, encrypted, community-hostable chat platform. Your conversations, your control." />
		<meta name="twitter:image" content="https://zentra.abstractmelon.net/og-image.svg" />
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
